<div id="add-experience-modal"
     class="skill-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="skill-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah pengalaman"></button>

    <div class="skill-form-modal__content">
        <button type="button"
                class="skill-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah pengalaman">&times;</button>

        <h2 id="add-experience-modal-title">Tambah Pengalaman Baru</h2>
        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience' %}"
              class="skill-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <p id="experience-form-error" class="form-error hide"></p>
            <div class="skill-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Pengalaman</button>
            </div>
        </form>
    </div>
</div>
